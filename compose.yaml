services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: placeflow
      POSTGRES_USER: placeflow
      POSTGRES_PASSWORD: placeflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placeflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/placeflow
      DB_USERNAME: placeflow
      DB_PASSWORD: placeflow
      JWT_SECRET: change-this-demo-secret-change-this-demo-secret
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
